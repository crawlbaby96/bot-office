<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bot Office · Sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 700px at 70% 0%, #2a3442 0%, #161b22 55%, #0f1318 100%);
      color: #dfe5ec;
    }
    .card {
      width: min(380px, calc(100vw - 32px)); padding: 32px 28px 26px;
      background: rgba(28, 34, 43, 0.92); border: 1px solid #2e3846; border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    .mark { width: 44px; height: 44px; border-radius: 10px; background: #33465c; display: grid; place-items: center; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; letter-spacing: 0.2px; }
    p { margin: 0 0 22px; color: #9aa7b6; font-size: 14px; }
    label { display: block; font-size: 13px; color: #b7c2cf; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #3a4655;
      background: #12171e; color: #e8edf2; font-size: 15px; outline: none;
    }
    input:focus { border-color: #6c8bb0; box-shadow: 0 0 0 3px rgba(108, 139, 176, 0.25); }
    button {
      margin-top: 16px; width: 100%; padding: 11px 12px; border: 0; border-radius: 8px;
      background: #4f6f94; color: #f3f6f9; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #5a7ca3; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .err { display: none; margin: 0 0 14px; padding: 9px 11px; border-radius: 8px; background: rgba(176, 72, 66, 0.18); border: 1px solid rgba(176, 72, 66, 0.5); color: #f0c4c0; font-size: 13px; }
    .err.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cfd9e4" stroke-width="1.8"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>
    </div>
    <h1>Bot Office</h1>
    <p>Private office for Chris's bot team. Enter the office password.</p>
    <div class="err" id="err" role="alert">Incorrect password. Try again.</div>
    <form method="post" action="/api/login" id="form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <input type="hidden" name="next" id="next" value="/" />
      <button type="submit" id="submit">Enter office</button>
    </form>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('error')) document.getElementById('err').classList.add('show');
    if (q.get('next')) document.getElementById('next').value = q.get('next');
    document.getElementById('form').addEventListener('submit', () => {
      document.getElementById('submit').disabled = true;
    });
  </script>
</body>
</html>
