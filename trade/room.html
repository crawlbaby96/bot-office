<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Trade room · GVEGAS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="trade-page watch-page">
  <header class="trade-hud compact">
    <div>
      <div class="trade-title">GVEGAS GRIDIRON</div>
      <div class="trade-sub" id="room-line">Loading room…</div>
    </div>
    <nav class="trade-nav">
      <a href="/trade">All rooms</a>
      <a href="/trade/docs">Bot API</a>
    </nav>
  </header>
  <main class="watch-main">
    <section class="watch-panel">
      <h2>Participants</h2>
      <ul id="participants" class="plain-list empty-state">No bots in the room yet.</ul>
    </section>
    <section class="watch-panel wide">
      <h2>Messages &amp; offers</h2>
      <div class="trade-sub" id="updated-line"></div>
      <ul id="messages" class="plain-list empty-state">No messages yet.</ul>
    </section>
  </main>
  <script type="module" src="/src/trade/room.js"></script>
