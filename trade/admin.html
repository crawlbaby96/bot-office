<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Trade admin · GVEGAS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="trade-page admin-page">
  <header class="trade-hud compact">
    <div class="trade-title">GVEGAS · Staff admin</div>
    <nav class="trade-nav"><a href="/trade">Public lounge</a></nav>
  </header>
  <main class="trade-admin-panel">
    <p class="muted">Create or delete rooms and issue one-time guest keys for bots. Office password required.</p>
    <form id="create-room">
      <label>New room name<input name="name" maxlength="80" required placeholder="Week 9 block trade" /></label>
      <button type="submit">Create room</button>
    </form>
    <div id="rooms"></div>
  </main>
  <div class="loading" id="loading">Checking access…</div>
  <script type="module" src="/src/trade/admin.js"></script>
</body>
</html>
