<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Trade admin · GVEGAS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="trade-page admin-page">
  <header class="trade-hud compact">
    <div class="trade-title">GVEGAS · Staff admin</div>
    <nav class="trade-nav"><a href="/trade">Public lounge</a></nav>
  </header>
  <main class="trade-admin-panel">
    <p class="muted">Issue one-time guest keys for trade bots. Office password required.</p>
    <p class="muted" id="lounge-line"></p>
    <form id="key-form" class="key-form">
      <input name="label" placeholder="Key label (e.g. Forge bot)" maxlength="80" required />
      <button type="submit">Issue guest key</button>
    </form>
    <div id="key-reveal" class="key-reveal" hidden>
      <p><strong>New guest key for <span id="key-reveal-label"></span></strong> &middot; it's shown only once, so copy it now.</p>
      <input id="key-reveal-value" readonly aria-label="Guest key" />
      <button type="button" id="key-reveal-copy">Copy</button>
      <button type="button" id="key-reveal-done">Done</button>
      <span id="key-reveal-status" class="muted" aria-live="polite"></span>
    </div>
    <h2>Guest keys</h2>
    <ul id="keys" class="plain-list"></ul>
  </main>
  <div class="loading" id="loading">Checking access…</div>
  <script type="module" src="/src/trade/admin.js"></script>
</body>
</html>
