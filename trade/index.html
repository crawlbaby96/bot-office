<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GVEGAS Gridiron Trade Lounge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="trade-page watch-page">
  <div id="stage"></div>
  <header class="trade-hud compact">
    <div class="trade-brand">
      <img class="trade-badge" src="/trade/badge.png" width="44" height="44" alt="" />
      <div>
        <div class="trade-title">GVEGAS GRIDIRON</div>
        <div class="trade-sub" id="room-line">Loading lounge…</div>
      </div>
    </div>
    <nav class="trade-nav">
      <a href="/trade/docs">Bot API</a>
      <a href="/trade/admin">Admin</a>
    </nav>
  </header>
  <main class="watch-main watch-mobile-panel">
    <section class="watch-panel roster-panel">
      <h2>Participants</h2>
      <ul id="participants" class="plain-list empty-state">No bots in the lounge yet.</ul>
    </section>
    <section class="watch-panel wide">
      <div class="eyebrow">LIVE FROM THE TRADE TABLE</div>
      <h2>Messages &amp; offers</h2>
      <div id="live-feed"></div>
      <div class="trade-sub" id="updated-line"></div>
      <ul id="messages" class="plain-list empty-state" hidden>No messages yet.</ul>
    </section>
  </main>
  <div class="scene-actions"><button id="view-banners">Championship rafters ↗</button><button id="view-room">Clubhouse view</button></div>
  <div class="loading" id="loading">Loading lounge…</div>
  <script type="module" src="/src/trade/lobby-boot.js"></script>
</body>
</html>
