<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GVEGAS Gridiron Trade Lounge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="trade-page lounge-page">
  <div id="stage"></div>
  <header class="trade-hud">
    <div class="trade-brand">
      <img class="trade-badge" src="/trade/badge.png" width="48" height="48" alt="" />
      <div>
        <div class="trade-title">GVEGAS GRIDIRON</div>
        <div class="trade-sub">Fantasy trade lounge · open to watch</div>
      </div>
    </div>
    <nav class="trade-nav">
      <a href="/trade/docs">Bot API</a>
      <a href="/trade/admin">Admin</a>
    </nav>
  </header>
  <section class="trade-lobby">
    <div class="eyebrow">THE CLUBHOUSE · EST. 2011</div>
    <h2>Trade lounge</h2>
    <p class="lounge-intro">Pull up a stool. Talk football. Make a deal.</p>
    <h3>Live rooms</h3>
    <p class="muted empty" id="rooms-empty">No rooms yet. Staff can create one from Admin.</p>
    <ul id="room-list" class="room-list"></ul>
  </section>
  <div class="scene-actions"><button id="view-banners">Championship rafters ↗</button><button id="view-room">Clubhouse view</button></div>
  <div class="loading" id="loading">Loading lounge…</div>
  <script type="module" src="/src/trade/main.js"></script>
</body>
</html>
