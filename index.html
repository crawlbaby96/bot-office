<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bot Office</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="stage"></div>

  <header class="hud hud-top">
    <div class="brand">
      <div class="title">Bot Office</div>
      <div class="sub" id="feed-line">Connecting…</div>
    </div>
    <nav class="views" aria-label="Camera">
      <button data-view="office" class="active">Office</button>
      <button data-view="rooftop">Rooftop</button>
      <button data-view="lead">Lead</button>
      <button data-view="board">Usage</button>
      <form method="post" action="/api/logout" class="signout"><button type="submit" title="Sign out" aria-label="Sign out">⎋</button></form>
    </nav>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>
  <div class="sim-label" id="sim-label" hidden>Simulation</div>

  <footer class="hud hud-bottom">
    <div class="legend" id="legend"></div>
    <button class="simulate" id="simulate" type="button">Simulate Work</button>
    <div class="usage-chip" id="usage-chip">Usage: no reading yet</div>
  </footer>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="loading" id="loading">Loading office…</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
